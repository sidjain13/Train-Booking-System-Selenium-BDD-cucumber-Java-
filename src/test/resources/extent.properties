# extent.properties

# Specifies the location of the report
basefolder.name=test-output/ExtentReports/
basefolder.datetimepattern=dd-MM-yyyy_HH-mm-ss

# Enables screenshot attachment to the report for failed steps
screenshot.dir=Screenshots/
screenshot.rel.path=../Screenshots/

# Report theme and name
extent.reporter.spark.start=true
extent.reporter.spark.out=Spark.html